<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Les Ombres de l'Empire — Bande originale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Pirata+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="plaque">

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="plaque-emblems">
        <svg class="emblem comet" viewBox="0 0 100 100">
            <path d="M50 20 L44 34 L50 30 L56 34 Z" fill="currentColor"/>
            <circle cx="50" cy="38" r="13" fill="currentColor"/>
            <path d="M38 48 C 26 56 18 70 10 86 C 24 80 36 72 44 60 Z" fill="currentColor"/>
            <path d="M62 48 C 74 56 82 70 90 86 C 76 80 64 72 56 60 Z" fill="currentColor"/>
        </svg>
        <svg class="emblem skull" viewBox="0 0 100 100"><path d="M50 10 C 30 10 16 26 16 46 C 16 58 22 66 28 72 L 28 82 C 28 86 32 90 36 90 L 40 90 L 40 82 L 44 82 L 44 90 L 56 90 L 56 82 L 60 82 L 60 90 L 64 90 C 68 90 72 86 72 82 L 72 72 C 78 66 84 58 84 46 C 84 26 70 10 50 10 Z M 36 44 C 40 44 43 47 43 51 C 43 55 40 58 36 58 C 32 58 29 55 29 51 C 29 47 32 44 36 44 Z M 64 44 C 68 44 71 47 71 51 C 71 55 68 58 64 58 C 60 58 57 55 57 51 C 57 47 60 44 64 44 Z M 50 56 L 55 68 L 45 68 Z" fill="currentColor" fill-rule="evenodd"/></svg>
        <svg class="emblem comet" viewBox="0 0 100 100" style="transform: scaleX(-1);">
            <path d="M50 20 L44 34 L50 30 L56 34 Z" fill="currentColor"/>
            <circle cx="50" cy="38" r="13" fill="currentColor"/>
            <path d="M38 48 C 26 56 18 70 10 86 C 24 80 36 72 44 60 Z" fill="currentColor"/>
            <path d="M62 48 C 74 56 82 70 90 86 C 76 80 64 72 56 60 Z" fill="currentColor"/>
        </svg>
    </div>

    <div class="divider"></div>

    <h1 class="album-title">Les Ombres de l'Empire</h1>
    <p class="album-subtitle">Bande originale officielle</p>

    <div class="divider"></div>

    <div class="track-info">
        <span class="note">♫</span>
        <span id="track-title" class="track-title">Chargement...</span>
    </div>

    <div class="divider"></div>

    <div class="controls">
        <button id="btn-prev" class="ctrl-btn" title="Morceau précédent">◄◄</button>
        <button id="btn-play" class="ctrl-btn ctrl-btn-main" title="Lecture / Pause">▶</button>
        <button id="btn-next" class="ctrl-btn" title="Morceau suivant">►►</button>
    </div>

    <div class="progress-row">
        <span id="time-current">00:00</span>
        <div id="progress-bar" class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="time-duration">00:00</span>
    </div>

    <div class="volume-row">
        <span class="volume-icon">🔊</span>
        <input id="volume-slider" type="range" min="0" max="100" value="80">
    </div>

    <div class="divider"></div>

    <div class="playlist" id="playlist"></div>

</div>

<audio id="audio-player"></audio>

<script src="script.js"></script>
</body>
</html>
